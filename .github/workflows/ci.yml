# CI workflow — runs on every push and PR. Just tests, no bundle.
# The release.yml workflow handles the bundle when a tag is pushed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check cortex_vision tests || true   # advisory for now

      - name: Run tests
        run: pytest -v --tb=short
